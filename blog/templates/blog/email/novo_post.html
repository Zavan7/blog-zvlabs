<!DOCTYPE html>
<html lang="pt-br">
<body style="font-family: sans-serif; line-height: 1.5; color: #1d1d1f; max-width: 560px; margin: 0 auto; padding: 24px;">
  <p style="color: #666; font-size: 14px;">Post novo no Blog ZV Labs</p>
  <h1 style="font-size: 22px; margin: 0 0 12px;">{{ post.titulo }}</h1>
  <p>{{ post.resumo }}</p>
  <p><a href="{{ post_url }}" style="display: inline-block; padding: 10px 18px; background: #1d1d1f; color: #fff; text-decoration: none; border-radius: 6px;">Ler o post</a></p>
  <hr style="border: none; border-top: 1px solid #ddd; margin: 32px 0 16px;">
  <p style="color: #666; font-size: 12px;">Você recebeu este e-mail porque se inscreveu no Blog ZV Labs. <a href="{{ cancelar_url }}">Cancelar inscrição</a>.</p>
</body>
</html>
